# Pneuma Dual-Pump Control System
# This configuration replaces the standard [fan] with two [fan_generic] definitions
# and overrides the M106/M107 commands to route air based on the selected mode.

# ==============================================================================
# 1. HARDWARE DEFINITIONS
# ==============================================================================
# Define the pins for your two pumps here. 
# IMPORTANT: You must comment out or remove any existing [fan] sections in your main printer.cfg

[fan_generic pump_cool]
pin: PF7 # <--- UPDATE THIS TO YOUR COOL PUMP PIN
min_power: 0.15
max_power: 1.0
#kick_start_time: 0.5
shutdown_speed: 1

[fan_generic pump_warm]
pin: PF9 # <--- UPDATE THIS TO YOUR WARM PUMP PIN
min_power: 0.15
max_power: 1.0
#kick_start_time: 0.5
shutdown_speed: 1

# ==============================================================================
# 2. STATE MANAGEMENT
# ==============================================================================
[gcode_macro PNEUMA_STATE]
description: Stores the current state of the Pneuma system
variable_mode: "COOL" # Default mode on startup (Options: COOL, WARM, DUAL, OFF)
variable_last_speed: 0.0 # Stores the last requested speed to re-apply when switching modes
gcode:
    # This macro just holds variables for the other macros to use.
    # Do not call this directly.

# ==============================================================================
# 3. MODE SWITCHING MACRO
# ==============================================================================
[gcode_macro SET_PNEUMA_MODE]
description: Set the active Pneuma pump mode (COOL, WARM, DUAL, OFF)
gcode:
    {% set new_mode = params.MODE|default("COOL")|string|upper %}
    {% set valid_modes = ["COOL", "WARM", "DUAL", "OFF"] %}
    
    {% if new_mode in valid_modes %}
        SET_GCODE_VARIABLE MACRO=PNEUMA_STATE VARIABLE=mode VALUE='"{new_mode}"'
        {action_respond_info("Pneuma Pump Mode set to: %s" % new_mode)}
        
        # Automatically re-apply the last known fan speed to the new mode
        {% set last_speed = printer["gcode_macro PNEUMA_STATE"].last_speed %}
        {% if last_speed > 0 %}
            # If the fan was on, turning it "on" again will re-route the air
            M106 S{ (last_speed * 255)|int }
        {% else %}
            # Ensure both pumps are off if the last speed was 0
            M107
        {% endif %}
    {% else %}
        {action_respond_info("ERROR: Invalid Pneuma mode '%s'. Must be COOL, WARM, DUAL, or OFF." % new_mode)}
    {% endif %}

# ==============================================================================
# 4. SLICER COMMAND OVERRIDES (M106 / M107)
# ==============================================================================
[gcode_macro M106]
description: Override standard part cooling command to route to active Pneuma pump
gcode:
    # Get requested speed, default to 100% (255) if S parameter is missing
    {% set raw_speed = params.S|default(255)|float %}
    
    # Convert 0-255 range to 0.0-1.0 percentage
    {% set safe_speed = raw_speed / 255.0 %}
    {% if safe_speed > 1.0 %}
        {% set safe_speed = 1.0 %}
    {% elif safe_speed < 0.0 %}
        {% set safe_speed = 0.0 %}
    {% endif %}
    
    # Store this speed so we can recall it if the user switches modes mid-print
    SET_GCODE_VARIABLE MACRO=PNEUMA_STATE VARIABLE=last_speed VALUE={safe_speed}
    
    # Get the current mode
    {% set mode = printer["gcode_macro PNEUMA_STATE"].mode %}
    
    # Apply speeds based on the mode
    {% if mode == "COOL" %}
        SET_FAN_SPEED FAN=pump_cool SPEED={safe_speed}
        SET_FAN_SPEED FAN=pump_warm SPEED=0.0
    {% elif mode == "WARM" %}
        SET_FAN_SPEED FAN=pump_cool SPEED=0.0
        SET_FAN_SPEED FAN=pump_warm SPEED={safe_speed}
    {% elif mode == "DUAL" %}
        SET_FAN_SPEED FAN=pump_cool SPEED={safe_speed}
        SET_FAN_SPEED FAN=pump_warm SPEED={safe_speed}
    {% elif mode == "OFF" %}
        SET_FAN_SPEED FAN=pump_cool SPEED=0.0
        SET_FAN_SPEED FAN=pump_warm SPEED=0.0
    {% endif %}

[gcode_macro M107]
description: Override standard part cooling off command
gcode:
    # Store that the speed is now 0
    SET_GCODE_VARIABLE MACRO=PNEUMA_STATE VARIABLE=last_speed VALUE=0.0
    
    # Turn off both pumps
    SET_FAN_SPEED FAN=pump_cool SPEED=0.0
    SET_FAN_SPEED FAN=pump_warm SPEED=0.0
